<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do item</title>
  <link rel="stylesheet" href="../estilo/animais-sub.css">
</head>
<body>
  <header class="topo">
    <div class="marca">Gerenciador de Fazendas</div>
    <nav aria-label="Navegação principal" style="display:contents">
      <ul class="menu">
        <li><a href="../dashboard.html">Menu principal</a></li>
        <li><a href="animais.html">Animais</a></li>
        <li><a href="maquinas.html">Máquinas</a></li>
        <li><a href="estoque.html" class="ativo" aria-current="page">Estoque</a></li>
        <li><a href="funcionarios.html">Funcionários</a></li>
        <li><a href="fazenda.html">Fazenda</a></li>
        <li><a href="utilitarios.html">Utilitários</a></li>
      </ul>
    </nav>
    <div class="usuario"><span class="avatar" aria-hidden="true">L</span><span>Luiz</span></div>
  </header>

  <main>
    <a class="voltar" href="estoque.html">Voltar para estoque</a>
    <h1 id="tituloItem">Carregando...</h1>
    <p class="sub" id="subItem"></p>

    <section class="secao">
      <div class="secao-topo"><h2>Dados do item</h2></div>
      <dl id="dadosItem"></dl>
    </section>

    <section class="secao">
      <div class="secao-topo">
        <h2>Movimentações</h2>
        <button type="button" id="btnMovimentacao">Registrar movimentação</button>
      </div>
      <div class="tabela-area"><table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Quantidade</th><th>Lote</th><th>Responsável</th><th>Motivo</th><th>Observações</th></tr></thead>
        <tbody id="corpoMovimentacoes"></tbody>
      </table></div>
    </section>
  </main>

  <dialog id="modalMovimentacao">
    <form id="formMovimentacao" method="dialog">
      <h2>Registrar movimentação</h2>
      <p class="nome-modal"></p>
      <div class="grade">
        <div class="campo"><label for="movTipo">Tipo</label>
          <select id="movTipo"><option>Entrada</option><option>Saída</option></select></div>
        <div class="campo"><label for="movQtd">Quantidade</label><input type="number" id="movQtd" min="0.001" step="0.001" required></div>
        <div class="campo"><label for="movData">Data</label><input type="date" id="movData" required></div>
        <div class="campo"><label for="movLote">Lote de destino (opcional)</label>
          <select id="movLote"><option value="">Nenhum</option></select></div>
        <div class="campo"><label for="movResp">Responsável</label><input type="text" id="movResp"></div>
        <div class="campo"><label for="movMotivo">Motivo</label><input type="text" id="movMotivo"></div>
        <div class="campo largo"><label for="movObs">Observações</label><input type="text" id="movObs"></div>
      </div>
      <p class="erro" role="alert" hidden></p>
      <div class="rodape-modal">
        <button type="button" class="secundario" data-fechar="modalMovimentacao">Cancelar</button>
        <button type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="../scripts/sessao.js"></script>
  <script src="../scripts/item.js"></script>
</body>
</html>
